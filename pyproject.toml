[project]
name = "pygp_particle_filter"
version = "0.1.0"
description = "Particle Filter implementation for 2D lidar using Gaussian Processes"
authors = [{ name = "Miquel Massot", email = "miquel.massot@gmail.com" }]
dependencies = ["numpy>=1.24.4", "scikit-learn>=1.3.2", "matplotlib>=3.7.4"]
requires-python = ">=3.8,<3.12"
readme = "README.md"
license = "GPL-3.0-or-later"


[tool.pdm]
distribution = false

[tool.isort]
force_single_line = true
lines_after_imports = 2
profile = "black"
